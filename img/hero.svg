<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160">
  <title>山貓追著火車在海邊奔跑</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .lynx { animation: bob 0.32s ease-in-out infinite alternate; }
      .dash { animation: flick 0.5s steps(2) infinite; }
    }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    @keyframes flick { 50% { opacity: 0.35; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa7d6"/>
      <stop offset="1" stop-color="#1d7fb3"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <pattern id="sleepers" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="2" width="5" height="6" fill="#8a6a4a"/>
    </pattern>
    <clipPath id="trainBody">
      <path d="M150 90 q0 -8 8 -8 h142 q22 0 30 26 l2 7 q2 8 -6 8 h-168 q-8 0 -8 -8 z"/>
    </clipPath>
  </defs>

  <!-- 天空、太陽、雲 -->
  <rect width="360" height="160" fill="url(#sky)"/>
  <circle cx="320" cy="28" r="13" fill="#fff3b0"/>
  <g fill="#fff" opacity="0.92">
    <ellipse cx="226" cy="30" rx="20" ry="6.5"/>
    <ellipse cx="238" cy="25" rx="11" ry="6.5"/>
    <ellipse cx="286" cy="58" rx="14" ry="4.5"/>
  </g>

  <!-- 山、海（福隆山海線） -->
  <path d="M0 92 L36 60 L70 80 L112 50 L152 86 L196 60 L236 92 Z" fill="#5fae7f"/>
  <path d="M150 92 L204 66 L244 82 L288 54 L332 80 L360 66 L360 92 Z" fill="#4c9a74"/>
  <rect y="86" width="360" height="22" fill="url(#sea)"/>
  <path d="M12 95 q6 -3 12 0 M84 101 q6 -3 12 0 M174 94 q6 -3 12 0 M254 99 q6 -3 12 0 M322 95 q6 -3 12 0" stroke="#c4ecff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 地面與鐵軌 -->
  <rect y="106" width="360" height="54" fill="#f3e2b8"/>
  <rect y="106" width="360" height="4" fill="#e3c98c"/>
  <rect y="127" width="360" height="7" fill="url(#sleepers)"/>
  <rect y="127" width="360" height="2" fill="#5b5b5b"/>
  <rect y="132" width="360" height="2" fill="#5b5b5b"/>
  <g fill="#9fcf7a">
    <path d="M30 150 l3 -8 l3 8 z M120 146 l3 -8 l3 8 z M210 152 l3 -8 l3 8 z M300 147 l3 -8 l3 8 z"/>
  </g>

  <!-- 火車 -->
  <path d="M252 82 l6 -9 l6 9" stroke="#5b5b5b" stroke-width="1.6" fill="none"/>
  <path d="M150 90 q0 -8 8 -8 h142 q22 0 30 26 l2 7 q2 8 -6 8 h-168 q-8 0 -8 -8 z" fill="#fbfcfe"/>
  <g clip-path="url(#trainBody)">
    <rect x="140" y="106" width="200" height="6" fill="#1d5fa8"/>
    <rect x="140" y="113" width="200" height="3" fill="#e8792b"/>
  </g>
  <path d="M150 90 q0 -8 8 -8 h142 q22 0 30 26 l2 7 q2 8 -6 8 h-168 q-8 0 -8 -8 z" fill="none" stroke="#1d5fa8" stroke-width="2"/>
  <g fill="#2b4a6b">
    <rect x="162" y="88" width="16" height="12" rx="2"/>
    <rect x="184" y="88" width="16" height="12" rx="2"/>
    <rect x="206" y="88" width="16" height="12" rx="2"/>
    <rect x="228" y="88" width="16" height="12" rx="2"/>
    <rect x="250" y="88" width="16" height="12" rx="2"/>
    <rect x="272" y="88" width="16" height="12" rx="2"/>
    <path d="M298 88 h10 q12 0 17 12 h-27 z"/>
  </g>
  <g stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M165 97 l5 -6 M187 97 l5 -6 M209 97 l5 -6 M231 97 l5 -6 M253 97 l5 -6 M275 97 l5 -6"/>
  </g>
  <circle cx="327" cy="112" r="2.2" fill="#ffd23f"/>
  <g fill="#333">
    <circle cx="170" cy="124" r="4"/><circle cx="186" cy="124" r="4"/>
    <circle cx="296" cy="124" r="4"/><circle cx="312" cy="124" r="4"/>
  </g>
  <g class="dash" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <path d="M122 92 h20 M116 102 h26 M124 112 h18"/>
  </g>

  <!-- 山貓（短尾巴、耳尖簇毛） -->
  <g class="dash" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M12 98 h16 M4 107 h22 M14 116 h14"/>
  </g>
  <g class="lynx">
    <path d="M58 111 L40 121 M63 113 L49 126" stroke="#c27a2c" stroke-width="6" stroke-linecap="round"/>
    <path d="M89 111 L107 118 M85 113 L99 125" stroke="#c27a2c" stroke-width="6" stroke-linecap="round"/>
    <path d="M53 101 L45 96" stroke="#e9a043" stroke-width="5" stroke-linecap="round"/>
    <path d="M47 97 L43.5 94.5" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="73" cy="105" rx="22" ry="11" fill="#e9a043" transform="rotate(-6 73 105)"/>
    <ellipse cx="75" cy="111" rx="14" ry="3.6" fill="#f6e3c4"/>
    <g fill="#9a5a1c">
      <circle cx="63" cy="101" r="1.5"/><circle cx="71" cy="98" r="1.3"/>
      <circle cx="79" cy="102" r="1.5"/><circle cx="67" cy="107" r="1.2"/>
    </g>
    <path d="M90 86 L91 73 L97.5 83 Z M98 83 L103 71 L106.5 85 Z" fill="#d9822b"/>
    <path d="M91 73 L90 68 M103 71 L104 66" stroke="#2b2118" stroke-width="2" stroke-linecap="round"/>
    <circle cx="98" cy="94" r="11" fill="#e9a043"/>
    <path d="M89 98 L84 108 L93 104 L94 110 L100 103 Z" fill="#f1ddc0"/>
    <path d="M98.5 92 q3 -3.2 6.2 0 q-3.1 2.2 -6.2 0 z" fill="#2b2118"/>
    <ellipse cx="106" cy="98.5" rx="4.6" ry="3.6" fill="#fff6ea"/>
    <circle cx="109.6" cy="96.6" r="1.4" fill="#e0675a"/>
    <path d="M105.5 100.6 q2 2 4 0" stroke="#2b2118" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- GO GO GO!（越來越大，像在加速） -->
  <text x="14" y="38" font-family="system-ui, 'Arial Black', 'Microsoft JhengHei', sans-serif" font-weight="900" font-style="italic"
        fill="url(#go)" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" letter-spacing="0.5">
    <tspan font-size="19">GO</tspan><tspan dx="5" font-size="25">GO</tspan><tspan dx="5" font-size="32">GO!</tspan>
  </text>
</svg>
